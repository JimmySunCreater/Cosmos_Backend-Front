<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos CloudScape 简化版</title>
    <link rel="stylesheet" href="https://unpkg.com/@cloudscape-design/components/styles.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .loading { padding: 40px; text-align: center; }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <h2>正在加载...</h2>
        </div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@cloudscape-design/components/index.js"></script>
    
    <script>
        // 等待所有依赖加载完成
        function waitForDependencies() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 50;
                
                const check = () => {
                    attempts++;
                    if (typeof React !== 'undefined' && 
                        typeof ReactDOM !== 'undefined' && 
                        typeof CloudscapeDesignSystem !== 'undefined') {
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        reject(new Error('依赖加载超时'));
                    } else {
                        setTimeout(check, 100);
                    }
                };
                
                check();
            });
        }
        
        // 主应用
        function App() {
            const [activeTab, setActiveTab] = React.useState('scene-generation');
            const [message, setMessage] = React.useState('');
            
            const { 
                AppLayout, 
                SideNavigation, 
                Container, 
                Header, 
                Button, 
                Alert,
                SpaceBetween,
                Box
            } = CloudscapeDesignSystem;
            
            const navigationItems = [
                {
                    type: "section",
                    text: "功能模块",
                    items: [
                        { type: "link", text: "场景生成", href: "#scene-generation" },
                        { type: "link", text: "场景管理", href: "#scene-management" },
                        { type: "link", text: "视频生成", href: "#video-generation" },
                        { type: "link", text: "日志诊断", href: "#log-diagnosis" }
                    ]
                }
            ];
            
            const renderContent = () => {
                switch (activeTab) {
                    case 'scene-generation':
                        return React.createElement(Container, {
                            header: React.createElement(Header, { variant: "h2" }, "场景生成")
                        },
                            React.createElement(SpaceBetween, { direction: "vertical", size: "m" },
                                React.createElement(Box, null, "这里是场景生成功能"),
                                React.createElement(Button, {
                                    variant: "primary",
                                    onClick: () => setMessage('场景生成功能正常！')
                                }, "测试场景生成"),
                                message && React.createElement(Alert, {
                                    type: "success",
                                    dismissible: true,
                                    onDismiss: () => setMessage('')
                                }, message)
                            )
                        );
                    case 'scene-management':
                        return React.createElement(Container, {
                            header: React.createElement(Header, { variant: "h2" }, "场景管理")
                        }, React.createElement(Box, null, "这里是场景管理功能"));
                    case 'video-generation':
                        return React.createElement(Container, {
                            header: React.createElement(Header, { variant: "h2" }, "视频生成")
                        }, React.createElement(Box, null, "这里是视频生成功能"));
                    case 'log-diagnosis':
                        return React.createElement(Container, {
                            header: React.createElement(Header, { variant: "h2" }, "日志诊断")
                        }, React.createElement(Box, null, "这里是日志诊断功能"));
                    default:
                        return React.createElement(Box, null, "选择一个功能模块");
                }
            };
            
            return React.createElement(AppLayout, {
                navigation: React.createElement(SideNavigation, {
                    activeHref: `#${activeTab}`,
                    header: { text: "Cosmos系统" },
                    items: navigationItems,
                    onFollow: (event) => {
                        event.preventDefault();
                        const href = event.detail.href.replace('#', '');
                        setActiveTab(href);
                    }
                }),
                content: renderContent(),
                toolsHide: true
            });
        }
        
        // 初始化应用
        waitForDependencies()
            .then(() => {
                console.log('所有依赖加载完成');
                const root = ReactDOM.createRoot(document.getElementById('app'));
                root.render(React.createElement(App));
            })
            .catch((error) => {
                console.error('依赖加载失败:', error);
                document.getElementById('app').innerHTML = `
                    <div class="loading" style="color: red;">
                        <h2>加载失败</h2>
                        <p>${error.message}</p>
                        <p>请检查网络连接或刷新页面重试</p>
                    </div>
                `;
            });
        
        // 错误处理
        window.addEventListener('error', (e) => {
            console.error('JavaScript错误:', e);
            document.getElementById('app').innerHTML = `
                <div class="loading" style="color: red;">
                    <h2>JavaScript错误</h2>
                    <p>${e.message}</p>
                    <p>文件: ${e.filename}</p>
                    <p>行号: ${e.lineno}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
